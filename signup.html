<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign Up — Hesien Warranty</title>
  </head>
  <body>
    <div id="site-header"></div>

    <main class="auth">
      <h1>Sign Up</h1>
      <form class="form" id="signup-form">
        <div class="field">
          <label for="name">Full Name</label>
          <input id="name" name="full_name" type="text" placeholder="Enter here" required />
        </div>
        <div class="field">
          <label for="account_type">Enterprise or Individual?</label>
          <select id="account_type" name="account_type" required>
            <option value="" disabled selected>Select an option</option>
            <option value="individual">Individual</option>
            <option value="enterprise">Enterprise</option>
          </select>
        </div>
        <div class="field company">
          <label for="company">If Enterprise - Company Name</label>
          <input id="company" name="company_name" type="text" placeholder="Enter here" />
        </div>
        <div class="field">
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" placeholder="Enter here" required />
        </div>
        <div class="field">
          <label for="phone">Phone Number</label>
          <input id="phone" name="phone" type="tel" placeholder="Enter here" required />
        </div>
        <div class="field">
          <label for="country">Country</label>
          <input id="country" name="country" type="text" placeholder="Enter here" required />
        </div>
        <div class="field field--pw">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter here" required />
          <button class="eye" type="button" data-toggle-password aria-label="Show password"></button>
        </div>
        <div class="field field--pw">
          <label for="confirm">Confirm Password</label>
          <input id="confirm" name="confirm_password" type="password" placeholder="Enter here" required />
          <button class="eye" type="button" data-toggle-password aria-label="Show password"></button>
        </div>
        <p class="form__row">
          Already a user ? <a class="em" href="/login.html">LOGIN</a>
        </p>
        <button class="btn btn--center" type="submit">Signup</button>
        <div class="or"><span>OR</span></div>
        <p class="social-label">Log in</p>
        <a class="btn-ghost" href="#">
          <img data-google width="24" height="24" alt="" />
          With Google
        </a>
      </form>
    </main>

    <div id="site-footer"></div>
    <script type="module" src="/src/pages/signup.ts"></script>
  </body>
</html>
