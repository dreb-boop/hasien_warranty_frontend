<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — Hesien Warranty</title>
  </head>
  <body>
    <div id="site-header"></div>

    <main class="auth">
      <h1>Login</h1>
      <form class="form" id="login-form">
        <div class="field">
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" placeholder="Enter here" required />
        </div>
        <div class="field field--pw">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter here" required />
          <button class="eye" type="button" data-toggle-password aria-label="Show password"></button>
        </div>
        <div class="form__row">
          <span>Need an account ? <a class="em" href="/signup.html">SIGN UP</a></span>
          <a href="#">Forgot Password ?</a>
        </div>
        <button class="btn btn--center" type="submit">Log In</button>
        <div class="or"><span>OR</span></div>
        <p class="social-label">Log in</p>
        <a class="btn-ghost" href="#">
          <img data-google width="24" height="24" alt="" />
          With Google
        </a>
        <a class="btn-ghost" href="/signup.html">Create New Account</a>
      </form>
    </main>

    <div id="site-footer"></div>
    <script type="module" src="/src/pages/login.ts"></script>
  </body>
</html>
